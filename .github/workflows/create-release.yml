name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.2)'
        required: true
        default: 'v0.1.2'
      title:
        description: 'Release Title'
        required: false
        default: 'myDB Studio v0.1.2'
      body:
        description: 'Release Description'
        required: false
        default: 'Official production release of myDB Studio for macOS and Linux.'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ inputs.tag }}" --yes || true
          gh release create "${{ inputs.tag }}" \
            --title "${{ inputs.title }}" \
            --notes "${{ inputs.body }}"
